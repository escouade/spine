name: Release

# Manual, one-click release of the @spinejs packages.
#
#   1. build every publishable package (dist/)
#   2. nx release --skip-publish -> bump versions, write CHANGELOG, commit + tag, push
#   3. per package: `yarn pack` (converts workspace:* + applies publishConfig into
#      the tarball) then `npm publish <tarball>` (OIDC trusted publishing).
#
# Auth = npm OIDC "trusted publishing" — NO token. Each package must first be
# published once with a token and have a Trusted Publisher configured on
# npmjs.com (GitHub Actions: escouade/spine, workflow release.yml). See
# RELEASING.md. yarn Berry's own OIDC path is undocumented/broken, so the actual
# upload uses the npm CLI (>= 11.5.1) on a yarn-built tarball.
on:
  workflow_dispatch:
    inputs:
      specifier:
        description: "Version or bump (e.g. 0.2.0, patch, minor, major). Ignored when publish_only."
        required: false
      first_release:
        description: "First release (no prior git tag to diff against)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run — version/changelog preview, no push, no publish"
        type: boolean
        default: false
      publish_only:
        description: "Recovery: skip version/tag, build + publish HEAD as-is"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag, create the GitHub release
      id-token: write # npm provenance attestation
    steps:
      - name: Require branch ref
        if: ${{ !startsWith(github.ref, 'refs/heads/') }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Release must run from a branch (nx release pushes a commit), got $REF"
          exit 1

      - name: Validate specifier
        if: ${{ !inputs.publish_only }}
        env:
          SPECIFIER: ${{ inputs.specifier }}
        run: |
          printf '%s' "$SPECIFIER" | grep -Eq '^(patch|minor|major|prepatch|preminor|premajor|prerelease|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$' \
            || { echo "Invalid specifier: '$SPECIFIER' (expected a bump keyword or an exact semver version)"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can diff against tags

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn version
        run: corepack prepare --activate

      - name: Install dependencies
        run: yarn install --immutable

      # The publish step selects by --no-private while build/version select by
      # the `publishable` nx tag — enforce that the two sets stay identical.
      - name: Verify publishable tag matches non-private workspaces
        run: |
          node -e '
          const fs = require("fs");
          const bad = [];
          for (const d of fs.readdirSync("packages")) {
            const mj = `packages/${d}/package.json`, pj = `packages/${d}/project.json`;
            if (!fs.existsSync(mj)) continue;
            const tagged = fs.existsSync(pj) && (JSON.parse(fs.readFileSync(pj, "utf8")).tags || []).includes("publishable");
            const priv = !!JSON.parse(fs.readFileSync(mj, "utf8")).private;
            if (tagged === priv) bad.push(d);
          }
          if (bad.length) { console.error("publishable tag / private field mismatch:", bad.join(", ")); process.exit(1); }'

      - name: Build packages
        run: yarn nx run-many -t build --projects=tag:publishable

      - name: Lint, typecheck, test
        run: yarn nx run-many -t lint typecheck test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, changelog, tag
        if: ${{ !inputs.publish_only }}
        run: >-
          yarn nx release "$SPECIFIER"
          --skip-publish
          ${{ inputs.first_release && '--first-release' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
          --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECIFIER: ${{ inputs.specifier }}
          # nx release runs `yarn install --mode update-lockfile` after the bump;
          # yarn defaults to immutable installs in CI, which would abort it.
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

      # OIDC trusted publishing needs the npm CLI >= 11.5.1; Node 20 ships npm 10.
      - name: Upgrade npm (OIDC support)
        if: ${{ !inputs.dry_run }}
        run: npm install -g npm@latest

      # No token: `id-token: write` lets the npm CLI exchange a GitHub OIDC token
      # for a short-lived npm session. Provenance is generated automatically.
      # `yarn pack` produces the correct tarball (workspace:* -> version,
      # publishConfig -> dist entry points); npm only uploads it.
      # Already-published versions are skipped (npm has no --tolerate-republish),
      # so a publish_only re-run resumes cleanly after a partial failure.
      - name: Publish to npm (OIDC)
        if: ${{ !inputs.dry_run }}
        run: |
          yarn workspaces foreach --all --no-private --topological exec bash -c '
            n=$(node -p "require(\"./package.json\").name")
            v=$(node -p "require(\"./package.json\").version")
            if npm view "$n@$v" version >/dev/null 2>&1; then
              echo "$n@$v already on npm — skipping"
            else
              yarn pack --out package.tgz && npm publish package.tgz
            fi
          '
