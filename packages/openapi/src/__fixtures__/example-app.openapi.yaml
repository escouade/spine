openapi: 3.1.0
info:
  title: Example
  version: 1.0.0
paths:
  /categories:
    post:
      operationId: postCategories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCategories_Body"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostCategories_ResponseEnvelope"
  /events:
    post:
      operationId: postEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEvents_Body"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostEvents_ResponseEnvelope"
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHealth_ResponseEnvelope"
  /me:
    get:
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMe_ResponseEnvelope"
  /orders:
    post:
      operationId: postOrders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostOrders_Body"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostOrders_ResponseEnvelope"
  /products:
    post:
      operationId: postProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostProducts_ResponseEnvelope"
  /reports/{id}:
    get:
      operationId: getReportsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              schema:
                const: "0"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReportsById_ResponseEnvelope"
              examples:
                sample:
                  value:
                    ok: true
                    data:
                      id: "1"
                      total: 3
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReportsById_ResponseEnvelope202"
        "404":
          description: No such report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{id}/archive:
    post:
      operationId: postReportsByIdArchive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostReportsByIdArchive_ResponseEnvelope"
        "404":
          description: Error (REPORT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stream:
    get:
      operationId: getStream
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
  /users:
    get:
      operationId: getUsers
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: number
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUsers_ResponseEnvelope"
    post:
      summary: Create a user
      tags:
        - users
      operationId: postUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUsers_Body"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostUsers_ResponseEnvelope"
  /users/{id}:
    get:
      summary: Find a user
      description: Fetch one user by id
      tags:
        - users
      operationId: findUser
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindUser_ResponseEnvelope"
              examples:
                sample:
                  value:
                    id: "1"
    delete:
      operationId: deleteUsersById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUsersById_ResponseEnvelope"
components:
  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
      required:
        - street
    DeleteUsersById_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    ErrorResponse:
      type: object
      properties:
        ok:
          const: false
        code:
          type: string
      required:
        - ok
        - code
    FindUser_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    GetHealth_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    GetMe_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    GetReportsById_Response:
      type: object
      properties:
        id:
          type: string
        total:
          type: number
      required:
        - id
        - total
      additionalProperties: false
    GetReportsById_Response202:
      type: object
      properties:
        jobId:
          type: string
      required:
        - jobId
      additionalProperties: false
    GetReportsById_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
        data:
          $ref: "#/components/schemas/GetReportsById_Response"
      required:
        - ok
        - data
    GetReportsById_ResponseEnvelope202:
      type: object
      properties:
        ok:
          const: true
        data:
          $ref: "#/components/schemas/GetReportsById_Response202"
      required:
        - ok
        - data
    GetUsers_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    PostCategories_Body:
      type: object
      properties:
        name:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/PostCategories_Body"
      required:
        - name
        - children
    PostCategories_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    PostEvents_Body:
      type: object
      properties:
        payload:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  const: click
                x:
                  type: number
              required:
                - kind
                - x
            - type: object
              properties:
                kind:
                  type: string
                  const: view
                url:
                  type: string
              required:
                - kind
                - url
          discriminator:
            propertyName: kind
      required:
        - payload
    PostEvents_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    PostOrders_Body:
      type: object
      properties:
        billing:
          $ref: "#/components/schemas/Address"
        shipping:
          $ref: "#/components/schemas/Address"
      required:
        - billing
        - shipping
    PostOrders_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    PostProducts_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    PostReportsByIdArchive_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    PostUsers_Body:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      required:
        - name
        - email
    PostUsers_ResponseEnvelope:
      type: object
      properties:
        ok:
          const: true
      required:
        - ok
    Product:
      type: object
      properties:
        sku:
          type: string
      required:
        - sku
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
